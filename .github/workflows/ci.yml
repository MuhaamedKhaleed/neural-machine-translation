name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Cache uv downloads by lock
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --extra dev --extra ml
      - name: Offline tests with real synthetic Marian backend
        run: uv run --no-sync python -m pytest --cov=local_translation --cov-report=term-missing
      - name: Lint
        run: uv run --no-sync python -m ruff check src tests scripts/demo.py
      - name: Format
        run: uv run --no-sync python -m ruff format --check src tests scripts/demo.py
      - name: Types
        run: uv run --no-sync python -m mypy src
      - name: Pre-commit
        run: uv run --no-sync python -m pre_commit run --all-files
      - name: Activate locked environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: CLI
        run: |
          python -m local_translation --help
          local-translation check-data --data examples/parallel.csv
          local-translation check-data --config .env.example
      - name: Build data-only container
        run: docker build --tag local-translation:ci .
      - name: Container smoke checks
        run: |
          docker run --rm local-translation:ci --help
          docker run --rm -v "$PWD/examples/parallel.csv:/data.csv:ro" local-translation:ci check-data --data /data.csv
      - name: Standalone synthetic demo
        run: uv run --no-sync python scripts/demo.py /tmp/standalone-synthetic-demo
      - name: Opt-in locked CPU ML container
        run: |
          docker build -f Dockerfile.ml --tag synthetic-ml:ci .
          docker run --rm --network none synthetic-ml:ci
