name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and ML packages
        run: python -m pip install -e '.[dev,ml]'
      - name: Offline tests with real synthetic Marian backend
        run: python -m pytest --cov=local_translation --cov-report=term-missing
      - name: Lint
        run: python -m ruff check src tests
      - name: Format
        run: python -m ruff format --check src tests
      - name: Types
        run: python -m mypy src
      - name: Pre-commit
        run: python -m pre_commit run --all-files
      - name: CLI
        run: |
          python -m local_translation --help
          local-translation check-data --data examples/parallel.csv
          local-translation check-data --config .env.example
      - name: Build data-only container
        run: docker build --tag local-translation:ci .
      - name: Container smoke checks
        run: |
          docker run --rm local-translation:ci --help
          docker run --rm -v "$PWD/examples/parallel.csv:/data.csv:ro" local-translation:ci check-data --data /data.csv
